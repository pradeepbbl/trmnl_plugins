# TRMNLP configuration
# {{ env.VARIABLE }} interpolation is available here
---
watch:
  - .trmnlp.yml
  - src

custom_fields:
  country: "10YNL----------L"
  price_unit: "currency_kwh"
  usage_examples: ""
  vat_percent: "0"


# The transform needs a real zone to slice out "today" correctly.
time_zone: Europe/Amsterdam

transform_runtime: enabled

variables:
  trmnl:
    plugin_settings:
      instance_name: Day-Ahead Prices
      polling_url: "http://localhost:5005/api/v1/energy-prices?bidding_zone={{ gb_zone | default: it_zone | default: dk_zone | default: no_zone | default: se_zone | default: country }}&price_unit={{ price_unit }}&vat_percent={{ vat_percent }}&usage_examples={{ usage_examples | url_encode }}&tz={{ time_zone }}&utc_offset=utc_offset=7200"
