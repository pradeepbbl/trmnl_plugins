<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB020"/>
      <stop offset="1" stop-color="#FF7A00"/>
    </linearGradient>
  </defs>

  <!-- squircle background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- dashed average line -->
  <line x1="86" y1="220" x2="426" y2="220" stroke="#14171F" stroke-width="10"
        stroke-dasharray="20 16" stroke-linecap="round" opacity="0.9"/>

  <!-- hourly price bars: past (white), current (solid dark), future (translucent white) -->
  <rect x="106" y="290" width="52" height="110" rx="10" fill="#FFFFFF"/>
  <rect x="176" y="230" width="52" height="170" rx="10" fill="#FFFFFF"/>
  <rect x="246" y="120" width="52" height="280" rx="10" fill="#14171F"/>
  <rect x="316" y="200" width="52" height="200" rx="10" fill="#FFFFFF" opacity="0.55"/>
  <rect x="386" y="260" width="52" height="140" rx="10" fill="#FFFFFF" opacity="0.55"/>
</svg>
