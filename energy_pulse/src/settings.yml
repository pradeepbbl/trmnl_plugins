---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
polling_verb: get
framework_version: 3.3.1
polling_url: "https://trmnl-plugin-api.spawnlab.dev/api/v1/energy-prices?bidding_zone={% if country == \"GB\" %}{{ gb_zone }}{% elsif country == \"IT\" %}{{ it_zone }}{% elsif country == \"DK\" %}{{ dk_zone }}{% elsif country == \"NOR\" %}{{ no_zone }}{% elsif country == \"SE\" %}{{ se_zone }}{% else %}{{ country }}{% endif %}&price_unit={{ price_unit }}&vat_percent={{ vat_percent }}&usage_examples={{ usage_examples | url_encode }}&tz={{ trmnl.user.time_zone_iana | url_encode }}&utc_offset={{ trmnl.user.utc_offset }}"
polling_headers: ''
polling_body: ''
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: country
  field_type: select
  name: Country
  description: The country or market area to show prices for.
  help_text: Covers ENTSO-E members only — EU, UK, Norway, and Switzerland. Not available for the US or other non-ENTSO-E markets. Great Britain, Italy, Denmark, Norway, and Sweden have multiple pricing zones — a zone field for that country will appear below once selected.
  default: 10YNL----------L
  options:
  - Austria: 10YAT-APG------L
  - Belgium: 10YBE----------2
  - Czechia: 10YCZ-CEPS-----N
  - Denmark: DK
  - Finland: 10YFI-1--------U
  - France: 10YFR-RTE------C
  - Germany-Luxembourg: 10Y1001A1001A82H
  - Great Britain: GB
  - Hungary: 10YHU-MAVIR----U
  - Ireland (SEM): 10Y1001A1001A59C
  - Italy: IT
  - Netherlands: 10YNL----------L
  - Norway: NOR
  - Poland: 10YPL-AREA-----S
  - Portugal: 10YPT-REN------W
  - Spain: 10YES-REE------0
  - Sweden: SE
  - Switzerland: 10YCH-SWISSGRIDZ
  conditional_validation:
  - when: "GB"
    required:
    - gb_zone
    visible:
    - gb_zone
  - when: "IT"
    required:
    - it_zone
    visible:
    - it_zone
  - when: "DK"
    required:
    - dk_zone
    visible:
    - dk_zone
  - when: "NOR"
    required:
    - no_zone
    visible:
    - no_zone
  - when: "SE"
    required:
    - se_zone
    visible:
    - se_zone
- keyname: gb_zone
  field_type: select
  name: Great Britain Zone
  description: The GSP payment region to show prices for.
  optional: true
  default: GB-C
  options:
  - East England: GB-A
  - East Midlands: GB-B
  - London: GB-C
  - North East England: GB-F
  - North Scotland: GB-P
  - North Wales, Merseyside & Cheshire: GB-D
  - North West England: GB-G
  - South & Central Scotland: GB-N
  - South East England: GB-J
  - South Wales: GB-K
  - South West England: GB-L
  - Southern England: GB-H
  - West Midlands: GB-E
  - Yorkshire: GB-M
- keyname: it_zone
  field_type: select
  name: Italy Zone
  description: The pricing zone to show prices for.
  optional: true
  default: 10Y1001A1001A73I
  options:
  - Centre-North: 10Y1001A1001A70O
  - Centre-South: 10Y1001A1001A71M
  - North: 10Y1001A1001A73I
  - SACOAC: 10Y1001A1001A885
  - SACODC: 10Y1001A1001A893
  - Sardinia: 10Y1001A1001A74G
  - Sicily: 10Y1001A1001A75E
  - South: 10Y1001A1001A788
- keyname: dk_zone
  field_type: select
  name: Denmark Zone
  description: The pricing zone to show prices for.
  optional: true
  default: 10YDK-1--------W
  options:
  - DK1: 10YDK-1--------W
  - DK2: 10YDK-2--------M
- keyname: no_zone
  field_type: select
  name: Norway Zone
  description: The pricing zone to show prices for.
  optional: true
  default: 10YNO-1--------2
  options:
  - Oslo (NO1): 10YNO-1--------2
  - Kristiansand (NO2): 10YNO-2--------T
  - Trondheim (NO3): 10YNO-3--------J
  - Tromsø (NO4): 10YNO-4--------9
  - Bergen (NO5): 10Y1001A1001A48H
- keyname: se_zone
  field_type: select
  name: Sweden Zone
  description: The pricing zone to show prices for.
  optional: true
  default: 10Y1001A1001A44P
  options:
  - SE1: 10Y1001A1001A44P
  - SE2: 10Y1001A1001A45N
  - SE3: 10Y1001A1001A46L
  - SE4: 10Y1001A1001A47J
- keyname: price_unit
  field_type: select
  name: Price unit
  description: Select the display unit for prices. Converts automatically between wholesale MWh and retail kWh or cents.
  default: currency_kwh
  options:
  - Currency per kWh (€0.0885/kWh): currency_kwh
  - Cents per kWh (8.85 ct/kWh): subunit_kwh
  - Currency per MWh (88.5 EUR/MWh): currency_mwh
- keyname: usage_examples
  field_type: text
  name: Usage examples
  description: One "Label = kWh" per line. Each is costed at the current price and at the cheapest hour still to come. Type "off" or "no" to hide the row.
  help_text: Leave blank for the four defaults shown above.
  placeholder: |-
    Dish washer, 10 min = 6
    Washing machine = 0.8
    Watch Tv = 1.1
    Charge an EV = 45
  optional: true
- keyname: vat_percent
  field_type: number
  name: VAT %
  description: Optional. Added on top of the wholesale price.
  help_text: Leave blank for raw wholesale prices.
  optional: true
  min: 0
  max: 100
- keyname: author_bio
  field_type: author_bio
  name: About this plugin
  category: environment,finance
  description: Energy Pulse covers ENTSO-E day-ahead electricity markets only —
    EU, UK, Norway, and Switzerland. It does not support the US or other
    non-ENTSO-E markets. Questions, bugs, or feature requests? Open an issue
    on GitHub or reach out by email.<br/>Source and docs live in the repo
    linked below.
  github_url: https://github.com/pradeepbbl/trmnl_plugins
  email_address: pradeepbbl@gmail.com
name: Energy Pulse
description: European day-ahead power prices
refresh_interval: 1440
