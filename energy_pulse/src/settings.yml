---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
polling_verb: get
framework_version: 3.2.0
polling_url: https://trmnl-plugin-api.spawnlab.dev/api/v1/energy-prices?bidding_zone={{ zone | default:country }}&price_unit={{ price_unit }}&vat_percent={{ vat_percent }}&usage_examples={{ usage_examples | url_encode }}&tz={{ trmnl.user.time_zone_iana | url_encode }}&utc_offset={{ trmnl.user.utc_offset }}
polling_headers: ''
polling_body: ''
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: country
  field_type: select
  name: Country
  description: The country or market area to show prices for.
  help_text: Covers ENTSO-E members only — EU, UK, Norway, and Switzerland. Not available for the US or other non-ENTSO-E markets. Great Britain, Italy, Denmark, Norway, and Sweden have multiple pricing zones — pick the specific zone below after choosing the country.
  default: 10YNL----------L
  options:
  - Austria: 10YAT-APG------L
  - Belgium: 10YBE----------2
  - Czechia: 10YCZ-CEPS-----N
  - Denmark: DK
  - Finland: 10YFI-1--------U
  - France: 10YFR-RTE------C
  - Germany-Luxembourg: 10Y1001A1001A82H
  - Great Britain: GB
  - Hungary: 10YHU-MAVIR----U
  - Ireland (SEM): 10Y1001A1001A59C
  - Italy: IT
  - Netherlands: 10YNL----------L
  - Norway: NO
  - Poland: 10YPL-AREA-----S
  - Portugal: 10YPT-REN------W
  - Spain: 10YES-REE------0
  - Sweden: SE
  - Switzerland: 10YCH-SWISSGRIDZ
  conditional_validation:
  - when: "gb"
    required:
    - zone
  - when: "it"
    required:
    - zone
  - when: "dk"
    required:
    - zone
  - when: "no"
    required:
    - zone
  - when: "se"
    required:
    - zone
  - when: "10yat-apg------l"
    hidden:
    - zone
  - when: "10ybe----------2"
    hidden:
    - zone
  - when: "10ycz-ceps-----n"
    hidden:
    - zone
  - when: "10yfi-1--------u"
    hidden:
    - zone
  - when: "10yfr-rte------c"
    hidden:
    - zone
  - when: "10y1001a1001a82h"
    hidden:
    - zone
  - when: "10yhu-mavir----u"
    hidden:
    - zone
  - when: "10y1001a1001a59c"
    hidden:
    - zone
  - when: "10ynl----------l"
    hidden:
    - zone
  - when: "10ypl-area-----s"
    hidden:
    - zone
  - when: "10ypt-ren------w"
    hidden:
    - zone
  - when: "10yes-ree------0"
    hidden:
    - zone
  - when: "10ych-swissgridz"
    hidden:
    - zone
- keyname: zone
  field_type: xhrSelect
  name: Zone
  description: The specific pricing zone within the selected country.
  help_text: Only used when Country is Great Britain, Italy, Denmark, Norway, or Sweden — ignored otherwise.
  optional: true
  default: GB-C
  depends_on: country
  endpoint: "https://trmnl-plugin-api.spawnlab.dev/api/v1/zones?country={{ country }}"
  label_field: label
  value_field: value
- keyname: price_unit
  field_type: select
  name: Price unit
  description: Select the display unit for prices. Converts automatically between wholesale MWh and retail kWh or cents.
  default: currency_kwh
  options:
  - Currency per kWh (€0.0885/kWh): currency_kwh
  - Cents per kWh (8.85 ct/kWh): subunit_kwh
  - Currency per MWh (88.5 EUR/MWh): currency_mwh
- keyname: usage_examples
  field_type: text
  name: Usage examples
  description: One "Label = kWh" per line. Each is costed at the current price and at the cheapest hour still to come. Type "off" or "no" to hide the row.
  help_text: Leave blank for the four defaults shown above.
  placeholder: |-
    Dish washer, 10 min = 6
    Washing machine = 0.8
    Watch Tv = 1.1
    Charge an EV = 45
  optional: true
- keyname: vat_percent
  field_type: number
  name: VAT %
  description: Optional. Added on top of the wholesale price.
  help_text: Leave blank for raw wholesale prices.
  optional: true
  min: 0
  max: 100
- keyname: author_bio
  field_type: author_bio
  name: About this plugin
  category: environment,finance
  description: Energy Pulse covers ENTSO-E day-ahead electricity markets only —
    EU, UK, Norway, and Switzerland. It does not support the US or other
    non-ENTSO-E markets. Questions, bugs, or feature requests? Open an issue
    on GitHub or reach out by email.<br/>Source and docs live in the repo
    linked below.
  github_url: https://github.com/pradeepbbl/trmnl_plugins
  email_address: pradeepbbl@gmail.com
name: Energy Pulse
description: European day-ahead power prices
refresh_interval: 1440
