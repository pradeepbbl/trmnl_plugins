name: TRMNL

on:
  pull_request:
  push:
    branches: [master]
    tags: ["*-v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.find.outputs.plugins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        env:
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            tag="$GIT_REF_NAME"
            plugin="${tag%-v*}"

            # Apple Health Plugin
            if [ "$plugin" == "apple_health" ]; then
              echo "plugins=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ ! -f "$plugin/.trmnlp.yml" ]; then
              echo "::error::Tag '$tag' doesn't map to a known plugin directory (parsed '$plugin')"
              exit 1
            fi
            plugins=$(jq -n -c --arg p "$plugin" '[$p]')
          else
            plugins=$(find . -mindepth 2 -maxdepth 2 -name '.trmnlp.yml' -printf '%h\n' \
              | sed 's|^\./||' | sort | jq -R -s -c 'split("\n")[:-1]')
          fi

          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  lint:
    needs: discover
    if: needs.discover.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.plugins) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview -v 0.12.0
      - name: Inject placeholder polling base URL (${{ matrix.plugin }})
        env:
          PLUGIN: ${{ matrix.plugin }}
          POLLING_BASE_URL: https://example.com
        run: |
          settings="$PLUGIN/src/settings.yml"
          envsubst '${POLLING_BASE_URL}' < "$settings" > "$settings.tmp"
          mv "$settings.tmp" "$settings"
      - name: trmnlp lint (${{ matrix.plugin }})
        working-directory: ${{ matrix.plugin }}
        run: trmnlp lint

  # Single stable check name for the branch ruleset: the matrix `lint` job
  # reports one check per plugin, so requiring those would need a ruleset
  # edit every time a plugin is added.
  lint-gate:
    needs: lint
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          # "skipped" = no plugins to lint (e.g. apple_health tag), not a failure.
          if [ "$LINT_RESULT" != "success" ] && [ "$LINT_RESULT" != "skipped" ]; then
            echo "::error::lint result: $LINT_RESULT"
            exit 1
          fi

  push:
    needs: [discover, lint]
    if: github.event_name == 'push' && needs.discover.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.plugins) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview -v 0.12.0
      - name: Inject polling base URL (${{ matrix.plugin }})
        env:
          PLUGIN: ${{ matrix.plugin }}
          POLLING_BASE_URL: ${{ vars.POLLING_BASE_URL }}
        run: |
          if [ -z "$POLLING_BASE_URL" ]; then
            echo "::error::POLLING_BASE_URL repo variable is not set"
            exit 1
          fi
          settings="$PLUGIN/src/settings.yml"
          envsubst '${POLLING_BASE_URL}' < "$settings" > "$settings.tmp"
          mv "$settings.tmp" "$settings"
      - name: trmnlp push (${{ matrix.plugin }})
        working-directory: ${{ matrix.plugin }}
        run: |
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            var_name="TRMNL_PROD_PLUGIN_ID_$(echo "$PLUGIN" | tr '[:lower:]-' '[:upper:]_')"
            plugin_id="${!var_name}"
            if [ -z "$plugin_id" ]; then
              echo "::error::No $var_name secret set for plugin '$PLUGIN'"
              exit 1
            fi
            trmnlp push --force --id "$plugin_id"
          else
            trmnlp push --force --id "$TRMNL_PREVIEW_PLUGIN_ID"
          fi
        env:
          GIT_REF: ${{ github.ref }}
          PLUGIN: ${{ matrix.plugin }}
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
          TRMNL_PREVIEW_PLUGIN_ID: ${{ secrets.TRMNL_PREVIEW_PLUGIN_ID }}
          TRMNL_PROD_PLUGIN_ID_ENERGY_PULSE: ${{ secrets.TRMNL_PROD_PLUGIN_ID_ENERGY_PULSE }}

  trigger-apple-health-release:
    if: startsWith(github.ref, 'refs/tags/apple_health-v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch release in trmnl_apple_health
        env:
          GH_TOKEN: ${{ secrets.APPLE_HEALTH_DISPATCH_TOKEN }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          version="${GIT_REF_NAME#apple_health-v}"
          # --ref is explicit so gh doesn't look up the default branch over
          # GraphQL, which the dispatch token isn't allowed to do.
          gh workflow run release.yml \
            --repo pradeepbbl/trmnl_apple_health \
            --ref master \
            --field version="$version"
