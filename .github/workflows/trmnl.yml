name: TRMNL

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.find.outputs.plugins }}
    steps:
      - uses: actions/checkout@v6
      - id: find
        run: |
          plugins=$(find . -mindepth 2 -maxdepth 2 -name '.trmnlp.yml' -printf '%h\n' \
            | sed 's|^\./||' | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  lint:
    needs: discover
    if: needs.discover.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview
      - name: trmnlp lint (${{ matrix.plugin }})
        working-directory: ${{ matrix.plugin }}
        run: trmnlp lint

  push:
    needs: [discover, lint]
    if: github.event_name == 'push' && needs.discover.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview
      # Master pushes publish to a preview plugin instance; tag pushes release to
      # the production instance -- both ids come from secrets rather than
      # settings.yml.
      - name: trmnlp push (${{ matrix.plugin }})
        working-directory: ${{ matrix.plugin }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            trmnlp push --force --id "$TRMNL_PROD_PLUGIN_ID"
          else
            trmnlp push --force --id "$TRMNL_PREVIEW_PLUGIN_ID"
          fi
        env:
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
          TRMNL_PREVIEW_PLUGIN_ID: ${{ secrets.TRMNL_PREVIEW_PLUGIN_ID }}
          TRMNL_PROD_PLUGIN_ID: ${{ secrets.TRMNL_PROD_PLUGIN_ID }}
          TRMNL_PREVIEW_PLUGIN_ID: ${{ secrets.TRMNL_PREVIEW_PLUGIN_ID }}
