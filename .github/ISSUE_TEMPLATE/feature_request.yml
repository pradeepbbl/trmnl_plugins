name: Feature request
description: Suggest an improvement or a new plugin
labels: [enhancement, needs-triage]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Request type
      options: [Improvement to an existing plugin, Other]
    validations: { required: true }
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin (if existing)
      options: [energy_pulse, apple_health, N/A]
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A sketch of the screen or data you'd like shown. Remember e-ink is grayscale only, with no animation.
  - type: textarea
    id: data
    attributes:
      label: Data source
      description: Where the data comes from (public API, country or grid, etc.), if relevant.
  - type: checkboxes
    id: scope
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates
          required: true
